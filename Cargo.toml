[package]
name = "claude-hooks"
version = "0.1.0"
edition = "2021"
description = "Claude Code PreToolUse guards as one sub-millisecond binary"

[dependencies]
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
serde_json = "1"
shlex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
